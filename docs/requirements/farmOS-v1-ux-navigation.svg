<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="880" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e1e1e">farmOS v1 — UX &amp; Navigation (Phase 4a)</text>

  <!-- zones -->
  <rect x="30" y="100" width="1140" height="300" rx="8" fill="#dbe4ff" fill-opacity="0.25" stroke="#4a9eed" stroke-width="1"/>
  <text x="1150" y="116" text-anchor="end" font-size="14" fill="#2563eb">PRESENTATION</text>
  <rect x="30" y="440" width="1140" height="105" rx="8" fill="#e5dbff" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1"/>
  <text x="1150" y="456" text-anchor="end" font-size="14" fill="#7c3aed">LOGIC</text>
  <rect x="30" y="585" width="1140" height="100" rx="8" fill="#d3f9d8" fill-opacity="0.25" stroke="#22c55e" stroke-width="1"/>
  <text x="1150" y="601" text-anchor="end" font-size="14" fill="#15803d">DATA</text>
  <rect x="30" y="725" width="1140" height="105" rx="8" fill="#dbe4ff" fill-opacity="0.25" stroke="#4a9eed" stroke-width="1"/>
  <text x="1150" y="741" text-anchor="end" font-size="14" fill="#2563eb">BROWSE / REPORTS</text>

  <!-- nav bar -->
  <rect x="40" y="66" width="1120" height="30" rx="6" fill="#fff3bf" fill-opacity="0.7" stroke="#f59e0b" stroke-width="1"/>
  <text x="600" y="86" text-anchor="middle" font-size="16" fill="#1e1e1e">Top nav:  Dashboard · Inventory · Batches · Entities · Contacts · Reports · Admin (→ /admin/)</text>

  <!-- hub -->
  <rect x="60" y="112" width="520" height="140" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="320" y="149" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">DASHBOARD  /  (action-first hub)</text>
  <text x="320" y="173" text-anchor="middle" font-size="16" fill="#1e1e1e">[+Sell] [+Expense] [+Harvest]</text>
  <text x="320" y="195" text-anchor="middle" font-size="16" fill="#1e1e1e">[+Produce] [+Procure]</text>
  <text x="320" y="221" text-anchor="middle" font-size="16" fill="#1e1e1e">P&amp;L  ·  Turnover  ·  Outstanding</text>

  <!-- /m/ -->
  <rect x="630" y="112" width="520" height="140" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="890" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">/m/  FAMILY SUBSET  (phone)</text>
  <text x="890" y="184" text-anchor="middle" font-size="16" fill="#1e1e1e">[+Sell] [+Expense] [+Contact] [Collect pay]</text>
  <text x="890" y="208" text-anchor="middle" font-size="16" fill="#1e1e1e">Today:  P&amp;L · Turnover · Outstanding</text>

  <text x="605" y="288" text-anchor="middle" font-size="16" fill="#757575">verb buttons open the capture screens  (save → Add another / Done)</text>

  <!-- capture screens -->
  <rect x="60"  y="305" width="190" height="85" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="155"  y="353" text-anchor="middle" font-size="18" fill="#1e1e1e">Quick Sale</text>
  <rect x="280" y="305" width="220" height="85" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="390"  y="353" text-anchor="middle" font-size="18" fill="#1e1e1e">Expense / Income</text>
  <rect x="530" y="305" width="170" height="85" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="615"  y="353" text-anchor="middle" font-size="18" fill="#1e1e1e">Harvest</text>
  <rect x="730" y="305" width="180" height="85" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="820"  y="353" text-anchor="middle" font-size="18" fill="#1e1e1e">Production</text>
  <rect x="940" y="305" width="200" height="85" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="1040" y="353" text-anchor="middle" font-size="18" fill="#1e1e1e">Procurement</text>

  <!-- capture -> service -->
  <line x1="155"  y1="390" x2="155"  y2="446" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="390"  y1="390" x2="390"  y2="446" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="615"  y1="390" x2="615"  y2="446" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="820"  y1="390" x2="820"  y2="446" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="1040" y1="390" x2="1040" y2="446" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- service -->
  <rect x="60" y="450" width="1090" height="85" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="605" y="482" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">SERVICE LAYER — atomic &amp; audited</text>
  <text x="605" y="508" text-anchor="middle" font-size="15" fill="#1e1e1e">record_sale · record_harvest · run_production · procure · record_transaction* · edit-in-place corrections</text>

  <!-- service -> data -->
  <line x1="255" y1="535" x2="255" y2="591" stroke="#15803d" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="300" y="568" font-size="14" fill="#15803d">stock +/-</text>
  <line x1="605" y1="535" x2="605" y2="591" stroke="#15803d" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="648" y="568" font-size="14" fill="#15803d">money</text>
  <line x1="955" y1="535" x2="955" y2="591" stroke="#15803d" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="998" y="568" font-size="14" fill="#15803d">lot + lineage</text>

  <!-- data -->
  <rect x="120" y="595" width="270" height="80" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="255" y="625" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">StockMovement ledger</text>
  <text x="255" y="649" text-anchor="middle" font-size="15" fill="#1e1e1e">stock = sum of moves</text>
  <rect x="470" y="595" width="270" height="80" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="605" y="625" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">Transaction ledger</text>
  <text x="605" y="649" text-anchor="middle" font-size="15" fill="#1e1e1e">income = accrual</text>
  <rect x="820" y="595" width="270" height="80" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="955" y="625" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">Batch  (lineage)</text>
  <text x="955" y="649" text-anchor="middle" font-size="15" fill="#1e1e1e">no. = &lt;item-code&gt;&lt;YYMMDD&gt;</text>

  <!-- data -> browse -->
  <line x1="255" y1="675" x2="185" y2="731" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="605" y1="675" x2="485" y2="731" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="955" y1="675" x2="780" y2="731" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="605" y1="675" x2="1025" y2="731" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- browse -->
  <rect x="60" y="735" width="240" height="85" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="180" y="767" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">Inventory / Stock</text>
  <text x="180" y="791" text-anchor="middle" font-size="15" fill="#ef4444">negative = red badge</text>
  <rect x="330" y="735" width="300" height="85" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="480" y="760" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">Reports</text>
  <text x="480" y="780" text-anchor="middle" font-size="15" fill="#1e1e1e">whole-farm + per-batch</text>
  <text x="480" y="800" text-anchor="middle" font-size="15" fill="#1e1e1e">month / yr / custom · print</text>
  <rect x="660" y="735" width="230" height="85" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="775" y="767" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">Batches</text>
  <text x="775" y="791" text-anchor="middle" font-size="15" fill="#1e1e1e">per-batch P&amp;L + rollup</text>
  <rect x="910" y="735" width="240" height="85" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="1030" y="760" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">Contacts</text>
  <text x="1030" y="780" text-anchor="middle" font-size="15" fill="#1e1e1e">history · outstanding</text>
  <text x="1030" y="800" text-anchor="middle" font-size="15" fill="#1e1e1e">payment per sale</text>

  <text x="40" y="860" font-size="14" fill="#757575">Screens (blue) → Services (purple) → Data ledgers (green) → Browse/Reports.   edit-in-place from any detail page.   * record_transaction = service to add in Build (flagged).</text>
</svg>
